<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Real-Time Chat</title>

    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            overflow: hidden;
        }

        /* MAIN APP */

        .app {
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            margin: 5vh auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: #111827;
            color: white;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .logo h1 {
            font-size: 18px;
        }

        .logo p {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .label {
            color: #9ca3af;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .username-box {
            display: flex;
            gap: 7px;
        }

        .username-box input {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1f2937;
            color: white;
            outline: none;
        }

        .save-btn {
            width: 42px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            cursor: pointer;
        }

        .connection-card {
            margin-top: 25px;
            padding: 15px;
            background: #1f2937;
            border-radius: 12px;
        }

        .connection-title {
            font-size: 13px;
        }

        .connection-status {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ef4444;
        }

        .dot.connected {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            font-size: 10px;
            color: #6b7280;
        }

        /* CHAT */

        .chat {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 75px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
        }

        .chat-title h2 {
            font-size: 16px;
        }

        .chat-title p {
            color: #6b7280;
            font-size: 11px;
            margin-top: 3px;
        }

        .online {
            font-size: 12px;
            color: #22c55e;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #f8fafc;
        }

        .welcome {
            text-align: center;
            margin: 60px auto;
            max-width: 350px;
            color: #6b7280;
        }

        .welcome-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .welcome h3 {
            color: #111827;
            margin-bottom: 8px;
        }

        .message-row {
            display: flex;
            margin-bottom: 15px;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message {
            max-width: 70%;
        }

        .sender {
            font-size: 11px;
            color: #6b7280;
            margin: 0 5px 4px;
        }

        .mine .sender {
            text-align: right;
        }

        .bubble {
            padding: 11px 15px;
            border-radius: 16px;
            background: #e5e7eb;
            color: #111827;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .mine .bubble {
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row:not(.mine) .bubble {
            border-bottom-left-radius: 4px;
        }

        .time {
            font-size: 9px;
            color: #9ca3af;
            margin-top: 4px;
            text-align: right;
        }

        /* INPUT */

        .input-area {
            padding: 15px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f3f4f6;
            border-radius: 14px;
            padding: 6px;
        }

        .input-box input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            padding: 12px;
            font-size: 14px;
        }

        .send {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .send:active {
            transform: scale(0.95);
        }

        /* MOBILE */

        @media (max-width: 700px) {

            body {
                background: white;
                overflow: hidden;
            }

            .app {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .sidebar {
                display: none;
            }

            .chat {
                width: 100%;
            }

            .header {
                height: 65px;
                padding: 0 15px;
            }

            .avatar {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .chat-title h2 {
                font-size: 15px;
            }

            .chat-title p {
                font-size: 10px;
            }

            .online {
                font-size: 10px;
            }

            .messages {
                padding: 15px 12px;
            }

            .message {
                max-width: 82%;
            }

            .bubble {
                font-size: 14px;
                padding: 10px 13px;
            }

            .input-area {
                padding: 10px;
            }

            .input-box {
                border-radius: 13px;
            }

            .input-box input {
                font-size: 14px;
                padding: 10px;
            }

            .send {
                width: 42px;
                height: 42px;
            }

            .welcome {
                margin: 35px auto;
                padding: 0 20px;
            }
        }

        /* SMALL PHONES */

        @media (max-width: 380px) {

            .header {
                padding: 0 10px;
            }

            .messages {
                padding: 12px 8px;
            }

            .message {
                max-width: 88%;
            }

            .bubble {
                font-size: 13px;
            }

            .online {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                💬
            </div>

            <div>
                <h1>Real-Time Chat</h1>
                <p>Instant messaging</p>
            </div>

        </div>

        <div class="label">
            YOUR NAME
        </div>

        <div class="username-box">

            <input
                    id="username"
                    type="text"
                    placeholder="Enter your name"
                    maxlength="20">

            <button
                    class="save-btn"
                    onclick="saveUsername()">
                ✓
            </button>

        </div>

        <div class="connection-card">

            <div class="connection-title">
                Connection
            </div>

            <div class="connection-status">

                <span
                        id="statusDot"
                        class="dot">
                </span>

                <span id="statusText">
                    Connecting...
                </span>

            </div>

        </div>

        <div class="footer">
            Spring Boot • WebSocket • STOMP
        </div>

    </aside>


    <!-- CHAT -->
    <main class="chat">

        <header class="header">

            <div class="chat-title">

                <div class="avatar">
                    💬
                </div>

                <div>
                    <h2>Global Chat</h2>
                    <p>Real-time conversation</p>
                </div>

            </div>

            <div
                    id="onlineText"
                    class="online">
                Connecting...
            </div>

        </header>


        <!-- MESSAGES -->

        <section
                id="messages"
                class="messages">

            <div
                    id="welcome"
                    class="welcome">

                <div class="welcome-icon">
                    👋
                </div>

                <h3>
                    Welcome!
                </h3>

                <p>
                    Enter your name and start chatting.
                    Your messages will appear instantly.
                </p>

            </div>

        </section>


        <!-- MESSAGE INPUT -->

        <div class="input-area">

            <div class="input-box">

                <input
                        id="messageInput"
                        type="text"
                        placeholder="Type a message..."
                        maxlength="500"
                        autocomplete="off">

                <button
                        class="send"
                        onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

    let stompClient = null;

    let username =
        localStorage.getItem("chatUsername") || "";


    const usernameInput =
        document.getElementById("username");

    const messageInput =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

    const statusDot =
        document.getElementById("statusDot");

    const statusText =
        document.getElementById("statusText");

    const onlineText =
        document.getElementById("onlineText");


    usernameInput.value = username;


    /* SAVE USERNAME */

    function saveUsername() {

        const name =
            usernameInput.value.trim();

        if (!name) {

            alert("Please enter your name.");

            usernameInput.focus();

            return;
        }

        username = name;

        localStorage.setItem(
            "chatUsername",
            username
        );

        messageInput.focus();
    }


    /* CONNECT TO SPRING BOOT */

    function connect() {

        const socket =
            new SockJS(
                "https://real-time-chatapplication1.onrender.com/chat"
            );

        stompClient =
            StompJs.Stomp.over(socket);


        stompClient.connect(

            {},

            function () {

                console.log(
                    "Connected to Spring Boot WebSocket"
                );

                setConnected(true);


                stompClient.subscribe(

                    "/topic/messages",

                    function (message) {

                        const chatMessage =
                            JSON.parse(
                                message.body
                            );

                        displayMessage(
                            chatMessage
                        );

                    }
                );

            },

            function (error) {

                console.error(
                    "WebSocket connection error:",
                    error
                );

                setConnected(false);

                setTimeout(
                    connect,
                    5000
                );
            }
        );
    }


    /* CONNECTION STATUS */

    function setConnected(connected) {

        if (connected) {

            statusDot.classList.add(
                "connected"
            );

            statusText.textContent =
                "Connected";

            onlineText.textContent =
                "● Online";

        } else {

            statusDot.classList.remove(
                "connected"
            );

            statusText.textContent =
                "Disconnected";

            onlineText.textContent =
                "Offline";
        }
    }


    /* SEND MESSAGE */

    function sendMessage() {

        const content =
            messageInput.value.trim();


        if (!content) {
            return;
        }


        if (!username) {

            alert(
                "Please enter your name first."
            );

            usernameInput.focus();

            return;
        }


        if (
            !stompClient ||
            !stompClient.connected
        ) {

            alert(
                "Not connected to the server."
            );

            return;
        }


        const chatMessage = {

            sender: username,

            content: content
        };


        stompClient.send(

            "/app/sendMessage",

            {},

            JSON.stringify(
                chatMessage
            )
        );


        messageInput.value = "";

        messageInput.focus();
    }


    /* DISPLAY MESSAGE */

    function displayMessage(message) {

        const welcome =
            document.getElementById(
                "welcome"
            );

        if (welcome) {
            welcome.remove();
        }


        const row =
            document.createElement(
                "div"
            );


        const mine =
            message.sender === username;


        row.className =
            "message-row" +
            (mine ? " mine" : "");


        const messageBox =
            document.createElement(
                "div"
            );

        messageBox.className =
            "message";


        const sender =
            document.createElement(
                "div"
            );

        sender.className =
            "sender";

        sender.textContent =
            message.sender;


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";

        bubble.textContent =
            message.content;


        const time =
            document.createElement(
                "div"
            );

        time.className =
            "time";

        time.textContent =
            getTime();


        messageBox.appendChild(
            sender
        );

        messageBox.appendChild(
            bubble
        );

        messageBox.appendChild(
            time
        );

        row.appendChild(
            messageBox
        );

        messages.appendChild(
            row
        );


        messages.scrollTop =
            messages.scrollHeight;
    }


    /* TIME */

    function getTime() {

        return new Date()
            .toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }


    /* ENTER TO SEND */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    usernameInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                saveUsername();
            }
        }
    );


    /* START CONNECTION */

    connect();

</script>

</body>
</html>
