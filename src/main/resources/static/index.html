<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Chat</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --background: #f4f6fb;
            --white: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --incoming: #f1f3f7;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1050px;
            height: 720px;
            background: var(--white);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 300px;
            background: #111827;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 28px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .brand p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .profile {
            padding: 25px 20px;
        }

        .profile-label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .username-box {
            display: flex;
            gap: 8px;
        }

        .username-box input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            outline: none;
            background: #1f2937;
            color: white;
            font-size: 13px;
        }

        .username-box button {
            border: none;
            width: 42px;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            cursor: pointer;
        }

        .online-card {
            margin: 5px 20px;
            padding: 16px;
            background: #1f2937;
            border-radius: 14px;
        }

        .online-title {
            font-size: 13px;
            color: #d1d5db;
        }

        .online-status {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #9ca3af;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34,197,94,.7);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 20px;
            color: #6b7280;
            font-size: 11px;
            text-align: center;
        }

        /* ================= CHAT ================= */

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            height: 85px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .chat-user {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .chat-user h2 {
            font-size: 16px;
        }

        .chat-user p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        .connection {
            font-size: 12px;
            color: var(--muted);
        }

        /* ================= MESSAGES ================= */

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background:
                radial-gradient(circle at 20% 20%, rgba(99,102,241,.04), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(139,92,246,.04), transparent 25%),
                #fafbfe;
        }

        .welcome {
            text-align: center;
            margin: 30px auto;
            max-width: 400px;
            color: var(--muted);
        }

        .welcome-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .welcome h3 {
            color: var(--text);
            margin-bottom: 7px;
        }

        .message-row {
            display: flex;
            margin-bottom: 18px;
            animation: messageIn .25s ease;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            max-width: 70%;
        }

        .sender {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 5px;
            margin-left: 5px;
        }

        .mine .sender {
            text-align: right;
            margin-right: 5px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 17px;
            background: var(--incoming);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .mine .bubble {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-row:not(.mine) .bubble {
            border-bottom-left-radius: 5px;
        }

        .time {
            font-size: 9px;
            color: #9ca3af;
            margin-top: 4px;
            text-align: right;
        }

        /* ================= INPUT ================= */

        .input-area {
            padding: 18px 22px;
            border-top: 1px solid var(--border);
            background: white;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f6fa;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 7px;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 12px;
            font-size: 14px;
            color: var(--text);
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .send-button {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .2s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(99,102,241,.3);
        }

        .send-button:active {
            transform: scale(.95);
        }

        /* ================= SCROLLBAR ================= */

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 750px) {

            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                display: none;
            }

            .chat-header {
                padding: 0 18px;
            }

            .messages {
                padding: 18px;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">💬</div>

            <div>
                <h1>Real-Time Chat</h1>
                <p>Instant messaging</p>
            </div>
        </div>

        <div class="profile">

            <div class="profile-label">
                YOUR NAME
            </div>

            <div class="username-box">
                <input
                        type="text"
                        id="username"
                        placeholder="Enter your name"
                        maxlength="20"
                >

                <button onclick="saveUsername()">
                    ✓
                </button>
            </div>

        </div>

        <div class="online-card">

            <div class="online-title">
                Connection
            </div>

            <div class="online-status">

                <span
                        id="statusDot"
                        class="status-dot">
                </span>

                <span id="statusText">
                    Connecting...
                </span>

            </div>

        </div>

        <div class="sidebar-footer">
            Built with Spring Boot WebSockets
        </div>

    </aside>


    <!-- CHAT -->
    <main class="chat-section">

        <header class="chat-header">

            <div class="chat-user">

                <div class="chat-avatar">
                    💬
                </div>

                <div>
                    <h2>Global Chat</h2>

                    <p>
                        Real-time conversation
                    </p>
                </div>

            </div>

            <div
                    id="connectionText"
                    class="connection">
                Connecting...
            </div>

        </header>


        <!-- MESSAGES -->
        <section
                id="messages"
                class="messages">

            <div
                    id="welcome"
                    class="welcome">

                <div class="welcome-icon">
                    👋
                </div>

                <h3>
                    Welcome to the chat!
                </h3>

                <p>
                    Enter your name and send a message.
                    Messages appear instantly for everyone.
                </p>

            </div>

        </section>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-wrapper">

                <input
                        type="text"
                        id="messageInput"
                        placeholder="Type a message..."
                        maxlength="500"
                        autocomplete="off"
                >

                <button
                        class="send-button"
                        onclick="sendMessage()"
                        title="Send message">

                    ➤

                </button>

            </div>

        </div>

    </main>

</div>


<script>

    let stompClient = null;

    let username = localStorage.getItem("chatUsername") || "";

    const usernameInput =
        document.getElementById("username");

    const messageInput =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

    const statusDot =
        document.getElementById("statusDot");

    const statusText =
        document.getElementById("statusText");

    const connectionText =
        document.getElementById("connectionText");


    /* ================= USERNAME ================= */

    usernameInput.value = username;

    function saveUsername() {

        const name =
            usernameInput.value.trim();

        if (!name) {

            alert("Please enter your name.");

            usernameInput.focus();

            return;
        }

        username = name;

        localStorage.setItem(
            "chatUsername",
            username
        );

        usernameInput.value = username;

        messageInput.focus();
    }


    /* ================= WEBSOCKET ================= */

    function connect() {

        /*
         * IMPORTANT:
         * This uses the same Render URL where
         * your Spring Boot application is deployed.
         */

        const socket =
            new SockJS(
                "/chat"
            );

        stompClient =
            StompJs.Stomp.over(socket);


        stompClient.connect(
            {},
            function () {

                console.log(
                    "Connected to WebSocket"
                );

                setConnected(true);


                stompClient.subscribe(
                    "/topic/messages",
                    function (message) {

                        const chatMessage =
                            JSON.parse(
                                message.body
                            );

                        displayMessage(
                            chatMessage
                        );

                    }
                );

            },
            function (error) {

                console.error(
                    "WebSocket error:",
                    error
                );

                setConnected(false);

                setTimeout(
                    connect,
                    5000
                );

            }
        );
    }


    /* ================= STATUS ================= */

    function setConnected(connected) {

        if (connected) {

            statusDot.classList.add(
                "connected"
            );

            statusText.textContent =
                "Connected";

            connectionText.textContent =
                "● Online";

        } else {

            statusDot.classList.remove(
                "connected"
            );

            statusText.textContent =
                "Disconnected";

            connectionText.textContent =
                "Offline";

        }
    }


    /* ================= SEND ================= */

    function sendMessage() {

        const content =
            messageInput.value.trim();


        if (!content) {

            return;
        }


        if (!username) {

            alert(
                "Please enter your name first."
            );

            usernameInput.focus();

            return;
        }


        if (
            !stompClient ||
            !stompClient.connected
        ) {

            alert(
                "Not connected to the server."
            );

            return;
        }


        const chatMessage = {

            sender: username,

            content: content

        };


        stompClient.send(

            "/app/sendMessage",

            {},

            JSON.stringify(
                chatMessage
            )

        );


        messageInput.value = "";

        messageInput.focus();
    }


    /* ================= DISPLAY ================= */

    function displayMessage(message) {

        const welcome =
            document.getElementById(
                "welcome"
            );

        if (welcome) {

            welcome.remove();

        }


        const row =
            document.createElement(
                "div"
            );


        const isMine =
            message.sender === username;


        row.className =
            "message-row" +
            (isMine ? " mine" : "");


        const messageBox =
            document.createElement(
                "div"
            );

        messageBox.className =
            "message";


        const sender =
            document.createElement(
                "div"
            );

        sender.className =
            "sender";

        sender.textContent =
            message.sender;


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";

        bubble.textContent =
            message.content;


        const time =
            document.createElement(
                "div"
            );

        time.className =
            "time";

        time.textContent =
            getCurrentTime();


        messageBox.appendChild(
            sender
        );

        messageBox.appendChild(
            bubble
        );

        messageBox.appendChild(
            time
        );

        row.appendChild(
            messageBox
        );


        messages.appendChild(
            row
        );


        messages.scrollTop =
            messages.scrollHeight;
    }


    /* ================= TIME ================= */

    function getCurrentTime() {

        return new Date()
            .toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }


    /* ================= ENTER KEY ================= */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    usernameInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                saveUsername();

            }

        }
    );


    /* ================= START ================= */

    connect();

</script>

</body>
</html>
